<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fondo redondeado con gradiente azul -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />

  <!-- Boleto de rifa centrado -->
  <g transform="translate(64, 96)" filter="url(#shadow)">
    <!-- Cuerpo del boleto blanco -->
    <path d="M 24 0 
             L 360 0 
             A 24 24 0 0 1 384 24 
             L 384 130 
             A 30 30 0 0 0 384 190 
             L 384 296 
             A 24 24 0 0 1 360 320 
             L 24 320 
             A 24 24 0 0 1 0 296 
             L 0 190 
             A 30 30 0 0 0 0 130 
             L 0 24 
             A 24 24 0 0 1 24 0 Z" 
          fill="#ffffff" />

    <!-- Línea punteada de corte -->
    <line x1="280" y1="20" x2="280" y2="300" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 8" />

    <!-- Texto RIFA -->
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#1e293b" text-anchor="middle" letter-spacing="4">RIFA</text>
    
    <!-- Números 00-99 destacados -->
    <rect x="36" y="110" width="208" height="84" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" />
    <text x="140" y="166" font-family="ui-monospace, monospace" font-weight="900" font-size="44" fill="#2563eb" text-anchor="middle">00 - 99</text>

    <!-- Pastilla Vendido en rojo -->
    <rect x="74" y="218" width="132" height="34" rx="17" fill="#dc2626" />
    <text x="140" y="240" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1">TALONARIO</text>

    <!-- Estrella decorativa lateral -->
    <g transform="translate(332, 160) scale(0.9)">
      <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" fill="#f59e0b" />
    </g>
  </g>
</svg>
